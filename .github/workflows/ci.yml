name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent tests
        run: python3 -m unittest discover -s tests
      - name: Schema check (guard tests over every saved card and report)
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s .claude/hooks
      - name: Figures check (₹ figures vs RHP text; report only, never gates)
        if: ${{ !cancelled() }}
        run: python3 -m ipo_agent.figures_check --all
      - name: DeepSeek driver tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s .claude/deepseek

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Schema drift (drizzle-kit generate must be a no-op)
        # No database needed: a later task can't change web/db/schema.ts without
        # a checked-in migration (task 007). Fails if generate leaves changes.
        if: ${{ !cancelled() }}
        run: npx drizzle-kit generate && test -z "$(git status --porcelain db)"
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Database tests on a Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: npm run test:db
